# Every night 23:00 WIB (16:00 UTC): test, rebuild the last 90 days, publish output/.
# Also runs the tests on every push / pull request.
name: Nightly pipeline
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Rebuild last 90 days
        if: github.event_name != 'pull_request'
        run: python -m kopisenja.run
      - name: Publish output
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --cached --quiet || git commit -m "Nightly data refresh $(date -u +%F)"
          git push
